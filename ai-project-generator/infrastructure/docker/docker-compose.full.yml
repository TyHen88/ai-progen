version: '3.8'

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: aiprogen_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - api

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: aiprogen_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aiprogen_db
      - DB_USER=aiprogen
      - DB_PASS=aiprogen_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: aiprogen_postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: aiprogen_db
      POSTGRES_USER: aiprogen
      POSTGRES_PASSWORD: aiprogen_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aiprogen_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: aiprogen_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminsecret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
