spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aiprogen_db}
    username: ${DB_USER:postgres}
    # No default — boot fails loudly rather than silently reusing a dev/example password.
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Schema is Flyway-only in prod — no runtime table creation/alteration.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  # No default — boot fails loudly rather than signing tokens with a secret that ships in git
  # history. See .ai/standards/security.md.
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# Set to the real deployed frontend origin(s), comma-separated — the localhost default from
# application.yml would otherwise silently apply and every request from the real frontend would
# fail CORS.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

generator:
  workspace-dir: ${GENERATOR_WORKSPACE_DIR:./generated}

storage:
  provider: local
  local:
    upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads}
  archive-output-dir: ${STORAGE_ARCHIVE_DIR:./storage/archives}

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    com.projectgenerator: INFO
