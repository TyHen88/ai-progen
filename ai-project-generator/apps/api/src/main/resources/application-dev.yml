spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:aiprogen_db}
    username: ${DB_USER:aiprogen}
    password: ${DB_PASS:aiprogen_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  # Local-dev-only fallback, used only when JWT_SECRET is unset. Never rely on this default
  # outside a -dev/-local profile — a prod profile must define jwt.secret with no default.
  secret: ${JWT_SECRET:5e2a9c14f7d803b6e91a4c7f2d5e8b1a4c7f0d3e6b9c2f5a8d1e4b7c0a3f6e9d}
  access-token-expiration: 86400000 # 24 Hours in ms
  refresh-token-expiration: 604800000 # 7 Days in ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  default-provider: ${AI_DEFAULT_PROVIDER:openai}
  timeout: 30000
  max-tokens: 4096
  temperature: 0.7

providers:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-pro

generator:
  # Ephemeral per-job workspace, cleaned up after archiving. See generated/AGENT.md.
  workspace-dir: ./generated

storage:
  provider: local
  local:
    upload-dir: ../../storage/uploads
  archive-output-dir: ../../storage/archives
