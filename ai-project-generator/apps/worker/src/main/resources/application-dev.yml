spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creator_copilot}
    username: ${DB_USER:postgres}
    # Same local-dev-only fallback as apps/api's application-dev.yml — this service reads/writes
    # the same database, schema owned entirely by apps/api's Flyway migrations.
    password: ${DB_PASS:psql@ty8080}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      # This service never owns schema — apps/api's Flyway migrations do. `none` here is
      # deliberate: it must never create/alter tables, only read/write rows.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

providers:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-pro
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-5-sonnet-20241022
