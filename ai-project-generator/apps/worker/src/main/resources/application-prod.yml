spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aiprogen_db}
    username: ${DB_USER:postgres}
    # No default — same reasoning as apps/api's application-prod.yml.
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

providers:
  # No defaults for any of these — a provider with no key configured already fails a job
  # cleanly rather than faking a response (see AbstractRestAiProvider), so there's no dev-style
  # convenience default to preserve here.
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-1.5-pro
  openai:
    api-key: ${OPENAI_API_KEY}
    model: gpt-4o
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    model: claude-3-5-sonnet-20241022

generator:
  workspace-dir: ${GENERATOR_WORKSPACE_DIR:./generated}

templates:
  root-dir: ${TEMPLATES_ROOT_DIR:../../templates}

storage:
  archive-output-dir: ${STORAGE_ARCHIVE_DIR:./storage/archives}

logging:
  level:
    root: INFO
    com.projectgenerator: INFO
